[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    smoke: Testes críticos de fumaça
    regressão: Testes de regressão funcional
    login: Testes da funcionalidade de autenticação
    productos: Testes de catálogo e ordenação
    carrinho: Testes de carrinho
    checkout: Testes de checkout
    navegação: Testes de navegação e logout
